<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=K2D:wght@400;600;700&display=swap"
        rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'K2D', sans-serif;

    .icon { font-size: 56px; }
    h1 { font-size: 26px; margin-bottom: 12px; }
    p { color: #52617a; line-height: 1.8; }
    .button {
      display: block;
      margin-top: 28px;
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(100deg, #2563eb, #7c3aed);
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
    }
    .button:hover { filter: brightness(1.1); }
    .button:focus-visible { outline: 3px solid #f59e0b; outline-offset: 4px; }
    footer { margin-top: 28px; font-size: 13px; color: #64748b; }
    footer a { color: #4338ca; }
  </style>
</head>

      หากพบปัญหาให้ติดต่อ
      <a href="tel:0885895125">0885895125</a>
